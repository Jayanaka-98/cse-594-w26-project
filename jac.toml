[project]
name = "flowboard"
version = "0.1.0"
description = "FlowBoard - A ClickUp-style project management app built with Jac"
entry-point = "main.jac"

[dependencies]
anthropic = ">=0.30.0"
byllm = "~=0.6"
jac-scale = ">=0.1.0"

[dependencies.npm]
tailwindcss = "^3.4.0"
autoprefixer = "^10.4.0"
postcss = "^8.4.0"
sonner = "^1.7.0"
date-fns = "^3.6.0"
recharts = "^2.12.0"
lucide-react = "latest"
react-markdown = "^9.0.0"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client.configs.postcss]
plugins = ["tailwindcss", "autoprefixer"]

[plugins.client.configs.tailwind]
content = ["./**/*.jac", "./**/*.cl.jac", "./.jac/client/**/*.{js,jsx,ts,tsx}"]
plugins = []

[plugins.client.configs.tailwind.theme.extend.fontFamily]
sans = ["Inter", "system-ui", "-apple-system", "sans-serif"]

[plugins.byllm.model]
default_model = "gpt-4o"
api_key = "${OPENAI_API_KEY}"

[plugins.scale.secrets]
OPENAI_API_KEY = "${OPENAI_API_KEY}"

[plugins.scale.kubernetes.plugin_versions]
jaclang = "latest"
jac_scale = "latest"
jac_client = "latest"
jac_byllm = "latest"
